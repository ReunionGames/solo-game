<style>
/* v5.9.5 (23 Nov 2026, beta) Luke's sound pick: one card sound (existing clack) and one button sound (uitap = select_001) for every action that had no sound in v5.9.2; open/close/toggle sounds removed. */
/* v5.9.4 (23 Nov 2026, beta) rebuilt from v5.9.2 + the v5.9.3 quiet sounds, ui() deferred to after the unlock path; iPhone silent switch inside the Wix iframe: silent <audio> loop now also runs there. */
/* v5.9.3 (23 Nov 2026, beta) quiet acknowledgement sounds on every tap that had no sound (Luke); reward sounds unchanged. */
/* v5.9.2 (23 Nov 2026, not published) mobile sound: iOS silent switch (audioSession 'playback' + silent <audio> fallback), unlock only on real taps, resume from 'interrupted'. See NOTES.md. */
/* v5.9.1 (21 Nov 2026) fix: a click during the 'Not quite…' second after a wrong card cancelled the move-to-true-place timer, so the game stuck with no score/Try again (Emily, laptop). Fixed: the run leaves the 'flipping' phase as soon as the card is judged, skip-the-flip can only act once, and a failsafe always brings up the score. RELEASE stays '5.9'. */
/* v5.9 (21 Nov 2026) Place it click sound + Flip, flip, flip! word pops, Place it locked while the first-card overlay is up, 'Try again' in both places, tutorial keys versioned per release (RELEASE), Read other side on enlarged timeline cards (no Close button), card-not-showing fix (2D enlarged card + loading fallback + image retry + back preload) */
/* v5.8 (21 Nov 2026) first-card overlay */
/* v5.7 (21 Nov 2026): step 0 (This is your timeline pointer) now shows at the start of every playthrough, not only the first game. v5.6 (21 Nov 2026): workshop (g) stage one. Header streak number restyled (gold ring, pop on each correct card, colour steps at 3/5/10, data-driven milestones), new-best burst + 'New best!' tag from the header (best kept per deck for the session only, no storage), Kenney CC0 sounds (clack, flip, tick, thud, jingle) with a remembered mute toggle, a + marker at the left end of every timeline row (paired with the end of the row above: one insertion index, lit together), desktop zoomed card centred with the button and line below it. End of a run: no See your score step; the score pops up by itself after the verdict, with a View the timeline button that shows the final timeline and a Restart game button. Place it, Flip! and step 0 unchanged. v5.5 (17 Nov 2026): step 1 (Tap to read your first card) removed. Card 1 opens zoomed exactly like cards 2+ (after step 0, or straight away when step 0 is skipped), then the chip, then the Tap a gold marker prompt and marker pulse until the first marker tap. One stage layout for every turn, so the timeline top never moves. The Timeline: earliest to latest label is gone (the marker prompt says earliest on the left). v5.4 (17 Nov 2026): step 0 (the start card on the timeline, first game only), shared burgundy pill button for Tap to read your first card / Flip! / Got it, buttons centred on the card. v5.3 (17 Nov 2026): three-step start on card 1 (tap card to read, enlarged card says Got it place it, then a gold-marker prompt stays over the timeline until the first tap). v5.2 (17 Nov 2026): lays itself out in the part of the frame the visitor can actually see (IntersectionObserver), compact two-column end screen on desktop, quick Flip! text white again. v5.1 (17 Nov 2026): card 1 back to the side-by-side start; cards 2+ zoom (smaller on desktop, near the top); 2-line chip; fixed-height top zone. v5 (17 Nov 2026): every new card opens zoomed (read it, tap off to place); slim chip + one instruction line; timeline gets the frame */
:root{--parch:#F4E8CB;--burg:#551309;--gold:#E9D29E;--red:#9c1c14;--ink:#2b1a10;--lab:#40110C;--soft:#7F5C4F}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--parch);color:var(--ink);font-family:'EB Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent}
#app{position:absolute;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);width:min(100%,1400px);margin:0 auto;display:flex;flex-direction:column}
#vs{position:absolute;left:0;top:0;width:1px;height:100%;visibility:hidden;pointer-events:none}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 12px;min-height:52px;border-bottom:1px solid #d8c79c}

#stage{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px 10px;text-align:center}
#stage.ch{flex-direction:column;align-items:stretch;justify-content:center;gap:2px}
#stage.pan{flex-direction:column}
/* Luke t257u: on desktop, the whole verdict panel advances to the next card (not on links or buttons) */
@media (min-width:700px) and (hover:hover) and (pointer:fine){#stage.nextclick{cursor:pointer}}
.lab{display:flex;align-items:center;gap:10px;font-weight:700;font-variant:small-caps;font-size:16px;line-height:1.1;letter-spacing:.04em;color:var(--lab)}
.lab .rule{flex:1;height:2px;background:var(--gold);position:relative;min-width:20px}
.lab .rule:after{content:"";position:absolute;right:-2px;top:-4px;border-left:8px solid var(--gold);border-top:5px solid transparent;border-bottom:5px solid transparent}
.lab.c{flex-direction:column;gap:3px;align-items:stretch;text-align:center;margin-bottom:5px}
.lab.c .rule{flex:none;width:100%;min-width:0}.lab.c .rule:after{display:none}
#tlh{flex:none;padding:3px 12px 0;border-top:1px solid #d8c79c}
.crow{display:flex;align-items:center;gap:6px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:46px;padding:2px 6px 2px 9px;background:#fbf3de;border:2px solid var(--burg);border-radius:12px;font:inherit;color:var(--burg);cursor:pointer;text-align:left;touch-action:manipulation;box-shadow:0 0 0 2px var(--gold)}
.chip .mc{width:26px;flex:none}
.chip .ct{flex:1;min-width:0;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .rd{flex:none;background:var(--burg);color:var(--parch);border-radius:999px;padding:3px 13px 4px;font-weight:700;font-size:16px;line-height:1.2}
#hint{font-size:17px;line-height:1.2;color:var(--burg);margin:0;text-align:center}
#stage.loud #hint{font-size:18px}
.helpb{position:relative;width:44px;height:44px;flex:none;border:0;background:none;padding:0;color:var(--burg);font:inherit;font-weight:700;font-size:19px;line-height:1;cursor:pointer}
.helpb:before{content:"";position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;border:1.5px solid #cdb98a;box-sizing:border-box}
.btn{font:inherit;font-size:19px;font-weight:600;background:var(--burg);color:var(--parch);border:0;border-radius:8px;min-height:46px;padding:0 30px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn.sec{background:none;color:var(--burg);border:1.5px solid #cdb98a;font-weight:600;font-size:17px;min-height:44px}
.panel{font-size:19px;line-height:1.4;margin-bottom:10px}.panel b{color:var(--burg)}
.panel .big{font-size:26px;font-weight:700;color:var(--burg);line-height:1.15}
.nbst{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:14px;background:var(--gold);color:var(--burg);font-weight:700;font-size:20px;box-shadow:0 0 12px 2px var(--gold)}
.vp{width:100%;display:flex;flex-direction:column;justify-content:center;margin:0}
.vh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vh .big{white-space:nowrap}.vh .nbst{margin:0;font-size:16px;padding:0 10px;box-shadow:0 0 8px 1px var(--gold)}
.vh .btn{min-height:44px;font-size:18px;padding:0 18px}
.vb{font-size:16px;line-height:1.25;margin-top:1px}.vb b{color:var(--burg)}
.nbst .lg{display:none}
/* the flip words */
.ff{display:inline-block;font-family:'Fredoka','Arial Rounded MT Bold',Arial,sans-serif;font-weight:700;font-size:60px;line-height:1.02;color:#fff;-webkit-text-stroke:max(5px,.09em) #28140E;paint-order:stroke fill;text-shadow:0 .06em .06em rgba(40,20,14,.55);letter-spacing:.5px;white-space:nowrap}
.ff i{font-style:normal;display:inline-block;margin:0 .1em;opacity:0;transform:scale(.5);animation:ffpop .22s cubic-bezier(.34,1.9,.64,1) forwards}
.ff.st i{display:block;margin:0}
.ff.q i{animation-duration:.15s;animation-delay:.1s}
.ff i:nth-child(2){animation-delay:.24s}.ff i:nth-child(3){animation-delay:.48s}
@keyframes ffpop{0%{opacity:0;transform:scale(.5)}27%{opacity:1}100%{opacity:1;transform:scale(1)}}
.cp{font-size:17px;margin:0 0 2px}
.panel:has(.ff){align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;flex:1 1 auto;min-height:0}
/* timeline */
#tlw{position:relative;flex:1 1 auto;min-height:0}
#tl{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px 18px 6px;--band:24px;--g:7px;--rg:10px;--tw:26px;--th:20px;--tf:19px}
.rw{margin:0 auto;position:relative}
.rw+.rw{margin-top:var(--rg)}
.cards{display:flex;gap:var(--g)}
.tabs{position:relative;height:var(--band)}
.slot{position:relative;cursor:zoom-in}
.slot.moved .card img,.slot.good .card img,.slot.pv .card img{filter:drop-shadow(0 0 2px var(--burg)) drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 14px rgba(233,210,158,.95))}
.tab{position:absolute;top:-10px;width:44px;height:44px;margin-left:-22px;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;z-index:3}
.tab span{position:absolute;left:50%;top:12px;width:var(--tw);height:var(--th);margin-left:calc(var(--tw) / -2);border:2px solid var(--burg);border-radius:7px;background:#fbf3de;color:var(--red);font-size:var(--tf);font-weight:700;text-align:center;transition:transform .15s}
.tab b{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;padding-bottom:1px}
.tab span:before{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;background:inherit;border-right:2px solid;border-bottom:2px solid;border-color:inherit;transform:rotate(45deg)}
#tl.quiet .tab span{border-color:var(--soft);color:var(--soft)}
#tl.loud .tab span,#tl .tab:hover span,#tl .tab.lit span{background:var(--gold);border-color:var(--burg);color:var(--red)}
#tl .tab:hover span,#tl .tab.lit span{transform:scale(1.12)}
.bar{position:absolute;top:var(--band);width:3px;margin-left:-1.5px;background:var(--soft);opacity:.6;border-radius:2px;pointer-events:none;z-index:2}
#tl.loud .bar,#tl .bar.hl{width:6px;margin-left:-3px;background:var(--gold);opacity:1;border:1px solid rgba(85,19,9,.45);box-shadow:0 0 8px 2px rgba(233,210,158,.95)}
#tl.loud .tab span{box-shadow:0 0 8px 2px rgba(233,210,158,.9)}
#tl.pulse .tab span,#tl.pulse .bar{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 1px 0 rgba(233,210,158,.5)}to{box-shadow:0 0 14px 6px rgba(233,210,158,1)}}
#tl.noplace .tab{visibility:hidden}#tl.noplace .bar{display:none}
.cue{position:relative;height:22px;pointer-events:none}
.cue i{position:absolute;bottom:3px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--burg)}
.cue span{position:absolute;bottom:0;white-space:nowrap;font-size:16px;font-weight:700;line-height:1.2;color:var(--burg)}
/* the previewed card and its Flip! */
.flipb{position:absolute;inset:0;z-index:4;border:0;background:none;padding:0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
/* flip animation */
.card{width:100%;aspect-ratio:1512/2112;position:relative;perspective:900px;background:transparent}
.inner{position:absolute;inset:0;transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.card.flip .inner{animation:sq var(--fd,.5s) ease-in-out forwards}
@keyframes sq{0%{transform:rotateY(0) scale(1,1)}50%{transform:rotateY(90deg) scale(1.07,.9)}100%{transform:rotateY(180deg) scale(1,1)}}
.card.pop{animation:popk .35s ease-out}
@keyframes popk{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.slot.settle{animation:stl .1s ease-out}
@keyframes stl{0%{transform:scale(.96)}100%{transform:scale(1)}}
.face{position:absolute;inset:0;backface-visibility:hidden;background:transparent}
.face img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.front{transform:rotateY(180deg)}
.card.bad img{filter:drop-shadow(0 0 5px #b3261e) drop-shadow(0 2px 6px rgba(0,0,0,.35))}
/* "Your card" tab when the placed card is out of view */
#yc{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:6;background:var(--burg);color:var(--parch);border:2px solid var(--gold);border-radius:999px;font:inherit;font-weight:700;font-size:17px;min-height:44px;padding:0 18px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#yc[hidden]{display:none}
/* overlays */
#zoom{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);background:rgba(35,17,9,.95);display:none;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;z-index:9;animation:zin .22s ease-out}
@media (min-width:700px){
#zoom .zt{font-size:20px}#zoom .zt b{font-size:22px}#zoom .zb{font-size:22px;min-height:52px}}
@keyframes zin{from{opacity:0}to{opacity:1}}
#zoom .zt{flex:none;text-align:center;color:var(--gold);font-size:17px;line-height:1.25;margin:0 0 8px;max-width:520px}
#zoom .zt b{font-variant:small-caps;letter-spacing:.04em;font-size:18px}
#zoom .zt:empty{display:none}
#zoom .z{flex:none;width:300px}
#zoom .zb{flex:none;margin-top:10px;background:var(--gold);color:var(--burg);font-size:20px;min-height:48px;padding:0 26px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
#help,#end{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);background:rgba(40,20,10,.62);display:none;align-items:center;justify-content:center;padding:10px;z-index:10}
.ep{background:var(--parch);border:2px solid var(--gold);border-radius:14px;width:100%;max-width:440px;max-height:100%;overflow:auto;padding:16px 18px 14px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:rise .4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ep h2{margin:0 0 4px;font-size:22px;color:var(--burg);font-weight:700;line-height:1.15}
.ep ol{text-align:left;margin:8px 0 12px;padding-left:22px;font-size:17px;line-height:1.35}
.ep ol li{margin-bottom:5px}
.ep .score{font-weight:700;font-size:38px;line-height:1.05;color:var(--burg)}
.ep .bs{font-size:20px;font-weight:600;margin-top:2px}
.ep .perf{display:inline-block;margin-top:6px;font-weight:700;font-size:22px;color:var(--burg);background:var(--gold);border-radius:14px;padding:0 14px}
.ep hr{border:0;height:2px;background:var(--gold);margin:12px 0}
.ep .facts{font-size:17px;line-height:1.35;margin:0 0 2px}.ep .facts b{color:var(--burg)}
.ep .demo{font-size:15px;color:var(--soft);font-style:italic;margin:0 0 6px}
.show{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.fan{position:relative;width:150px;height:116px}
.fan img{position:absolute;bottom:0;width:80px;height:auto;border-radius:6px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.fan img:nth-child(1){left:0;transform:rotate(-9deg);transform-origin:50% 100%}
.fan img:nth-child(2){left:35px;z-index:1}

.box{width:112px;height:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);display:block}
.ep .acts{display:flex;flex-direction:column;align-items:center;gap:8px}
.ep .acts .btn:first-child{width:100%;max-width:300px}
.short .ep{padding:12px 14px 10px}.short .ep .score{font-size:32px}.short .ep hr{margin:8px 0}.short .show{margin:4px 0 8px}.short .fan{height:100px}.short .fan img{width:70px}.short .box{width:96px}
@media (min-width:700px){
 header{padding:8px 20px;min-height:56px}.brand b{font-size:19px;white-space:nowrap}
 #tlh{padding:5px 24px 0}.lab{font-size:17px}
 .crow{max-width:760px;margin:0 auto;width:100%}.chip .ct{font-size:20px}.chip{min-height:52px}.chip .mc{width:30px}#hint{font-size:21px}#stage.loud #hint{font-size:21px}
 .vb{font-size:21px;text-align:center}.vh{justify-content:center;gap:24px}.nbst .lg{display:inline}
 #tl{padding:12px 32px;--band:32px;--g:12px;--rg:12px;--tw:32px;--th:24px;--tf:22px}   /* Luke t259u: extra side padding so the end + markers are not clipped */
 .cue span{font-size:18px}
 .panel{font-size:21px}.panel .big{font-size:30px}
}
@media (prefers-reduced-motion:reduce){.ff i{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* reduce motion: steady glow instead of a pulse */

/* v5.1 */

.hw{display:flex;flex-direction:column;align-items:stretch;flex:none}

.ctl{display:flex;flex-direction:column;align-items:center;max-width:300px;min-width:0}

/* v5.3: prompts as solid pills over the cards (workshop e) */
.pill{background:rgba(85,19,9,.92);color:var(--parch);border-radius:14px;padding:6px 14px 7px;text-align:center;font-weight:700;font-size:18px;line-height:1.2;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none}

   iOS gets the same effect from a tiny silent looping <audio> started inside the tap. (2) The context is only created/resumed in
   events Safari counts as a tap (touchend, click, keydown, mouse pointerdown), not touch pointerdown, so the silent unlock blip is

function sparkleAt(host,cx,cy,n){if(RM.matches)return;for(let i=0;i<n;i++){const s=document.createElement('i');s.className=host.id==='nhs'?'sp':'csp';const a=(i/n)*Math.PI*2+Math.random()*.25,d=28+Math.random()*36;s.style.cssText='left:'+cx+'px;top:'+cy+'px;--tx:'+Math.round(Math.cos(a)*d*1.35)+'px;--ty:'+Math.round(Math.sin(a)*d)+'px;--d:'+(1.1+Math.random()*.5).toFixed(2)+'s;--dl:'+(Math.random()*.2).toFixed(2)+'s';host.appendChild(s)}}
function clearConquerFx(){const b=$('#cfx');if(b)b.innerHTML=''}
function syncConquerFx(){const b=$('#cfx');if(!b)return;const fr=b.getBoundingClientRect();
 b.querySelectorAll('.cfx-item').forEach(item=>{const e=tl.find(x=>x.conquered&&x.c&&x.c.id===item.dataset.id),card=e&&e.el;if(!card||!card.isConnected){item.style.visibility='hidden';return}const r=card.getBoundingClientRect();item.style.visibility='visible';item.style.left=(r.left-fr.left)+'px';item.style.top=(r.top-fr.top)+'px';item.style.width=r.width+'px';item.style.height=r.height+'px'})}
function ensureConquerOverlay(e,animate){const box=$('#cfx');if(!box||!e||!e.c||!e.el)return;let item=box.querySelector('.cfx-item[data-id="'+e.c.id+'"]');
 if(!item){item=document.createElement('div');item.className='cfx-item'+(animate?'':' settled');item.dataset.id=e.c.id;item.innerHTML='<div class="cfx-rays"><i></i></div><div class="cfx-glow"></div>';const clone=e.el.cloneNode(true);clone.classList.remove('pop');clone.classList.add('cfx-card');item.appendChild(clone);box.appendChild(item)}syncConquerFx()}
function conquerFx(e){const sl=e.el&&e.el.parentElement;if(!sl)return;sl.classList.add('good','conquered');ensureConquerOverlay(e,true);const item=$('#cfx .cfx-item[data-id="'+e.c.id+'"]');if(item&&!RM.matches){sparkleAt(item,item.offsetWidth/2,item.offsetHeight/2,18);setTimeout(()=>{item.querySelectorAll('.csp').forEach(n=>n.remove())},1800)}window.__ev&&window.__ev.push('conquer:'+e.c.id)}   /* Luke t260u: rays/glow in the unclipped #cfx overlay */
function correct(e){clearTimeout(zeroFly.t);clearTimeout(zeroFly.u);const zf=document.querySelector('.zfly');if(zf)zf.remove();
 const prevBest=best;streak++;nRight++;runBest=Math.max(runBest,streak);const isNewHigh=streak>prevBest;
 if(isNewHigh)bigFlash('stf gold','<i>New best</i><i>streak</i><i class="n">'+streak+'</i>','newBestStreak:'+streak);
 else bigFlash('stf','<i>Streak</i><i class="n">'+streak+'</i>','streak:'+streak);
 best=Math.max(best,streak);setBest(best);stkCold=false;stkRed=false;stats();streakPop();phase='result';learned=true;
 const conquered=isStruggling(e.c);noteCard(e.c,true);
 if(conquered){e.conquered=true;sfx('conquer');conquerFx(e);if(e.newBest)newBestBurst()}   /* own sound for the struggled-card moment; skip streakpop/jingle so they don't clash (Luke t253u / t254u) */
 else if(e.newBest){sfx('jingle');newBestBurst()}else sfx('streakpop');   /* jingle + header burst on the first new best after a break (or the start of the run); later new bests in the same streak get the gold pop-up and streakpop (Luke t238u / t244u / t258u) */
 const last=!deck.length;if(e.newBest)nbShown=true;
 e.el.parentElement.classList.add('good');if(e.conquered)e.el.parentElement.classList.add('conquered');if(!RM.matches)e.el.classList.add('pop');
 const nb='';   /* v5.6: the header 'New best!' tag is the only new-best label */
 verdict('Spot on!',when(e),last?null:['Next card',()=>draw()],nb);
 if(last)later(over,Math.max(TEST?400:0,END_WIN*TS));              /* last card: the score pops up by itself once the verdict has registered */
 ycCheck(e);
 }
function when(e){const k=tl.indexOf(e),pv=tl[k-1]&&tl[k-1].c,nx=tl[k+1]&&tl[k+1].c,b=t=>'<b>'+t+'</b>';
 return b(e.c.title)+' happens '+(pv&&nx?'after '+b(pv.title)+' and before '+b(nx.title):pv?'after '+b(pv.title):'before '+b(nx.title))+'.'}
function wrong(e){e.el.classList.add('bad');noteCard(e.c,false);sfx('thud');nWrong++;const lost=streak;streak=0;nbShown=false;stkCold=true;stats();if(lost>0)streakBroken();   /* Luke t258u: a break re-arms the new-best jingle */verdict('Not quite…');ycCheck(e);later(()=>miss(e),1300*TS);
 setTimeout(()=>{if(phase==='judging'&&cur===e&&!e.moved){window.__ev.push('failsafe:miss');miss(e)}},1000*TS+1200)}   /* v5.9.1 failsafe: never stuck on 'Not quite…' */
function miss(e){const old=e.el.getBoundingClientRect();
 tl.splice(tl.indexOf(e),1);const k=tl.filter(x=>key(x.c)<key(e.c)).length;
 e.moved=true;e.up=true;e.pending=false;tl.splice(k,0,e);
 e.fixd=true;phase='result';timeline();showEl(e.el,false);
 const last=!deck.length;
 /* Discovery v2 (Luke 24 Nov, t202u): no timer. The player reads why and taps Next card (or See your score after the last card) */
 verdict('Not quite',when(e),last?['See your score',()=>over()]:['Next card',()=>draw()]);ycCheck(e);   /* v5.9.1 failsafe: the score always pops up */   /* the score pops up by itself after the card has slid to its true place */
 if(!RM.matches){const sl=e.el.parentElement,nw=e.el.getBoundingClientRect(),dx=old.left-nw.left,dy=old.top-nw.top;
  if(dx||dy){sl.style.transition='none';sl.style.transform='translate('+dx+'px,'+dy+'px)';sl.style.zIndex=4;sl.getBoundingClientRect();
   sl.style.transition='transform .6s ease-in-out';sl.style.transform='';later(()=>{sl.style.transition='';sl.style.zIndex=''},700)}}}
/* ---- end screen ---- */
function over(){phase='over';applyFrame();$('#pill').hidden=true;$('#s0').hidden=true;s0Active=false;$('#fc').hidden=true;$('#zoom').style.display='none';resolved=null;sel=null;hideYc();best=Math.max(best,streak);setBest(best);stats();
 const perfect=nWrong===0&&nRight===total&&total>0,score=nRight+runBest;
 let was=false;try{was=localStorage.getItem(UNLOCKKEY)==='1';if(perfect)localStorage.setItem(UNLOCKKEY,'1')}catch(e){}
 const unlocked=perfect||was,fresh=perfect&&!was;
 let prevHS=0;try{prevHS=Math.max(0,+localStorage.getItem(HSKEY)||0)}catch(e){}
 const newHS=score>prevHS&&score>0;if(newHS){try{localStorage.setItem(HSKEY,String(score))}catch(e){}}
 window.__disc={nRight,nWrong,runBest,score,perfect,unlocked,fresh,newHS,prevHS};window.__ev.push('over:'+nRight+'/'+nWrong+'/'+runBest);
 const lock='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0'+(unlocked?'':'v2.5')+'" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
 const end=$('#end');
 end.innerHTML='<div class="ep dsc" role="dialog" aria-label="Your result"><div class="e1">'+
  /* theme line removed per Luke 24 Nov 20:59 */
  '<div class="slist"><div class="sc">'+
  '<div class="inc" data-v="'+nWrong+'"><small>Incorrect</small><b>0</b></div>'+
  '<div class="okn" data-v="'+nRight+'"><small>Correct</small><b>0</b></div>'+
  '<div class="bst" data-v="'+runBest+'"><small>Best streak</small><b>0</b></div></div>'+
  '<div class="tot" data-v="'+score+'"><small>Total<br>correct + best streak</small><b>0</b></div></div>'+
  (perfect?'<div class="perf">Perfect!</div>':'')+
  (unlocked?'<a class="unl'+(fresh?' new':'')+'" id="endu" href="'+ENDURANCE_URL+'" target="_self">'+lock+'<span>'+(fresh?'Endurance unlocked! Play Endurance':'Play Endurance')+'</span></a>'
   :'<div class="unl" id="endu">'+lock+'<span>Get all '+total+' right in one go to unlock <b>Endurance</b></span></div>')+
  '</div><hr><div class="e2">'+
  '<a class="btn green" id="buy" href="'+BUY_D+'" target="_blank" rel="noopener">Get the full game</a>'+
  '<div class="sell"><img class="box" src="'+BOX+'" alt="The Chronicles of the Kingdom game box"><p>This web game uses '+DECK_ALL.length+' of the 52 cards.<br><b>52</b> Bible Event Cards &middot; <b>1+</b> players &middot; <b>Age 9+</b></p></div>'+
  '<p class="lead">Leading a group? Try the <a href="'+LEADER_URL+'" target="_blank" rel="noopener">free Leader\'s Guide preview</a>.</p>'+
  '</div><div class="acts"><div class="a2"><button class="btn" id="again">Try again</button><button class="btn gold" id="viewtl">View the timeline</button></div></div></div>';
 end.style.display='flex';$('#again').onclick=()=>{ui('tap');newRun()};$('#viewtl').onclick=()=>{ui('tap');viewTimeline()};$('#buy').addEventListener('click',()=>ui('tap'));
 const eu=$('a#endu');if(eu)eu.addEventListener('click',()=>ui('tap'));
 $('#again').focus({preventScroll:true});countUp()}
/* the score counts up in Luke's order: incorrect, correct, best streak, then the total (correct + best streak) */
function countUp(){const els=[...document.querySelectorAll('#end .sc>div'),$('#end .tot')],D=TEST?20:420,GAP=TEST?10:200;let t=TEST?0:350;
 const fin=()=>{if(window.__disc){window.__disc.counted=true;window.__ev.push('counted');if(window.__disc.newHS)highScore()}};
 if(RM.matches){els.forEach(el=>{el.classList.add('on');el.querySelector('b').textContent=el.dataset.v});fin();return}
 els.forEach((el,i)=>{const v=+el.dataset.v,b=el.querySelector('b'),last=i===els.length-1;
  setTimeout(()=>{if(phase!=='over')return;el.classList.add('on');const t0=performance.now(),dur=v?D:1;
   sfx('pop',1+i*.12);
   const step=()=>{const k=Math.min(1,(performance.now()-t0)/dur);b.textContent=Math.round(v*k);if(k<1)requestAnimationFrame(step);else if(last){sfx(window.__disc&&window.__disc.perfect?'jingle':'tick');fin()}};step()},t);
  t+=D+GAP+(last?0:0)})}
/* Discovery v5 (Luke t212u): after the total counts up, a New high score! pop-up if this total beats the stored best (first game only if total > 0). About 1.5s, then fade. */
function highScore(){let o=$('#nhs');if(o)o.remove();o=document.createElement('div');o.id='nhs';o.className='gold';o.setAttribute('aria-live','assertive');
 o.innerHTML='<span class="ff st"><i>New high</i><i>score!</i></span>';document.body.appendChild(o);fitNHS(o);o.setAttribute('aria-label','New high score!');window.__ev.push('highScore');
 if(!RM.matches){const f=o.querySelector('.ff'),r=f.getBoundingClientRect(),or=o.getBoundingClientRect();sparkleAt(o,r.left+r.width/2-or.left,r.top+r.height/2-or.top,16)}
 const hold=TEST?800:1500,fade=TEST?350:450;clearTimeout(highScore.t);clearTimeout(highScore.u);
 highScore.t=setTimeout(()=>o.classList.add('out'),hold);highScore.u=setTimeout(()=>{if(o.parentNode)o.remove()},hold+fade)}
function fitNHS(o){const f=o.querySelector('.ff'),W=o.clientWidth-24,H=o.clientHeight-24;let fs=Math.min(130,W*.28,H/2.6);f.style.fontSize=Math.max(42,Math.floor(fs))+'px';
 let n=0;while(n++<30&&(f.scrollWidth>W||f.scrollHeight>H)&&fs>42){fs-=3;f.style.fontSize=Math.floor(fs)+'px'}}
/* 'View the timeline' on the score: close it and show the finished timeline with a Try again button (v5.9: same words as the score) */
function viewTimeline(){$('#end').style.display='none';phase='review';hideYc();applyFrame();
 const s=$('#stage');clearNextClick(s);s.innerHTML='';s.className='pan v';sizeStage('verdict');
 const p=document.createElement('div');p.className='panel vp';const hr=document.createElement('div');hr.className='vh';
 hr.innerHTML='<span class="big">Your timeline</span>';const b=document.createElement('button');b.className='btn';b.id='restart';b.textContent='Try again';b.onclick=()=>{ui('tap');newRun()};hr.appendChild(b);p.appendChild(hr);
 const v=document.createElement('div');v.className='vb';v.innerHTML='<b>'+nRight+' of '+total+'</b> correct · Best streak <b>'+runBest+'</b>';p.appendChild(v);s.appendChild(p);
 timeline();$('#tl').scrollTop=0;b.focus({preventScroll:true})}
function relayout(){applyFrame();if(!phase||!hand&&phase==='choose')return;if(phase==='review'){sizeStage('verdict');timeline();return}if(phase==='choose')renderStage();else sizeStage('verdict');if(phase==='flipping')fitFF();timeline();positionS0();fitZoom();if(ycFor)ycCheck(ycFor)}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(relayout,120)});
$('#tl').addEventListener('scroll',syncConquerFx,{passive:true});
document.addEventListener('click',ev=>{if(!(ev.target.closest&&ev.target.closest('#mute, #vol, #rst, #rsq')))skipFlip()},true);
newRun();
})();
